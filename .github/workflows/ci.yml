name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Run tests with coverage
        id: coverage
        run: |
          uv run pytest --cov=prim_api --cov-report=term --cov-report=json
          PERCENT=$(python3 -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered']))")
          echo "percent=$PERCENT" >> "$GITHUB_OUTPUT"

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: d72c7687b024402a96d08a3f7e684284
          filename: coverage-badge.json
          label: coverage
          message: "${{ steps.coverage.outputs.percent }}%"
          valColorRange: ${{ steps.coverage.outputs.percent }}
          minColorRange: 50
          maxColorRange: 100

      # Network smoke test only: the sync logic itself is covered by unit tests.
      # Since 2026 the PRIM portal answers 403 to automated clients (page and
      # direct spec URL alike), which failed this step on main regardless of the
      # code. It stays visible (annotation) but no longer blocks a change.
      - name: Dry-run sync pipeline (non-blocking)
        continue-on-error: true
        run: |
          uv run python -m tools.sync_all --dry-run || {
            echo "::warning::sync dry-run failed (PRIM portal unreachable from CI?)"
            exit 1
          }

      # The exporter is what consumers pin (uvx from a tag): check that it works
      # from the built wheel, outside the checkout, with its schema packaged.
      - name: Check the installed exporter
        run: |
          uv build --wheel -o /tmp/dist
          cd /tmp
          uvx --from /tmp/dist/prim_api-*.whl export-referential --help
          uvx --from /tmp/dist/prim_api-*.whl python -c \
            "from prim_api.referential import load_schema; load_schema(1)"
