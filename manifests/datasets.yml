    export_format: "jsonl"
    validate: true
  # Added for the stations referential exporter (prim_api.referential): stops
  # (platforms, the only level with WGS 84 coordinates) and multimodal hubs.
  - dataset_id: "arrets"
    portal_base: "https://data.iledefrance-mobilites.fr"
    export_format: "jsonl"
    validate: true
  - dataset_id: "zones-de-correspondance"
    portal_base: "https://data.iledefrance-mobilites.fr"
    export_format: "jsonl"
    validate: true
  # Format 2 of the referential: entrances and exits of stations, and their stop areas.
  - dataset_id: "acces"
    portal_base: "https://data.iledefrance-mobilites.fr"
    export_format: "jsonl"
    validate: true
  - dataset_id: "relations-acces"
    portal_base: "https://data.iledefrance-mobilites.fr"
